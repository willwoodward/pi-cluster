apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pod-operator
  template:
    metadata:
      labels:
        app: pod-operator
    spec:
      serviceAccountName: kopf-operator
      containers:
      - name: pod-operator-container
        image: localhost:30007/pod-operator:latest
        imagePullPolicy: Always
        env:
        - name: NODE_SSH_USER
          value: "pi"
        - name: LIGHT_SCRIPT_PATH
          value: "/home/pi/Documents/light/serial_control_host.py"
        volumeMounts:
        - name: ssh-key
          mountPath: /root/.ssh
          readOnly: true
      volumes:
      - name: ssh-key
        secret:
          secretName: pod-operator-ssh-key
          defaultMode: 0400
          items:
          - key: id_rsa
            path: id_rsa
