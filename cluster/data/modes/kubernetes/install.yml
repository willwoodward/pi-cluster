- name: Install k3s server on the control-plane node
  hosts: master
  become: yes
  tasks:
    - name: Install k3s server
      shell: |
        curl -sfL https://get.k3s.io | sh -s - server --write-kubeconfig-mode 644
      args:
        creates: /usr/local/bin/k3s

    - name: Read the node token
      slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_token_file

    - name: Store the node token as a fact
      set_fact:
        k3s_token: "{{ k3s_token_file.content | b64decode | trim }}"

- name: Join worker nodes to the cluster
  hosts: workers
  become: yes
  vars:
    server_host: "{{ hostvars[groups['master'][0]]['ansible_host'] }}"
    server_token: "{{ hostvars[groups['master'][0]]['k3s_token'] }}"
  tasks:
    - name: Install k3s agent and join the server
      shell: |
        curl -sfL https://get.k3s.io | \
          K3S_URL=https://{{ server_host }}:6443 \
          K3S_TOKEN={{ server_token }} sh -
      args:
        creates: /usr/local/bin/k3s
