- name: Point k3s at the in-cluster registry mirror
  hosts: all
  become: yes
  vars:
    k3s_service: "{{ 'k3s' if inventory_hostname in groups['master'] else 'k3s-agent' }}"
  tasks:
    - name: Ensure the k3s config directory exists
      file:
        path: /etc/rancher/k3s
        state: directory
        mode: "0755"

    - name: Write the registry mirror configuration
      copy:
        dest: /etc/rancher/k3s/registries.yaml
        content: |
          mirrors:
            "localhost:30007":
              endpoint:
                - "http://localhost:30007"
      notify: Restart k3s

  handlers:
    - name: Restart k3s
      systemd:
        name: "{{ k3s_service }}"
        state: restarted
        enabled: yes
