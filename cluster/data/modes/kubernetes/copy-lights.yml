- name: Install the LED serial-control script on every node
  hosts: all
  vars:
    light_dir: "/home/{{ ansible_user }}/Documents/light"
  tasks:
    - name: Ensure the light directory exists
      file:
        path: "{{ light_dir }}"
        state: directory
        mode: "0755"

    - name: Copy serial_control_host.py to the node
      copy:
        src: lights/serial_control_host.py
        dest: "{{ light_dir }}/serial_control_host.py"
        mode: "0644"
