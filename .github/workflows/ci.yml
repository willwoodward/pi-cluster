name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:  # reused by release.yml before publishing

permissions:
  contents: read

jobs:
  lint:
    name: Lint, format, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: ruff format
        run: uv run ruff format --check .
      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: ty
        run: uv run ty check

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run pytest -v

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - name: Check the package metadata
        run: uvx twine check --strict dist/*
      - name: Smoke-test the built wheel
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/cluster --version
          /tmp/smoke/bin/cluster modes
