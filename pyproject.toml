[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-cluster"
version = "0.1.0"
description = "Turn a stack of Raspberry Pis into a distributed-systems lab: k3s, your own binaries, and LEDs."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Will Woodward", email = "will@woodwardweb.com" }]
keywords = ["raspberry-pi", "cluster", "k3s", "kubernetes", "ansible", "distributed-systems", "homelab"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Clustering",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "ansible-core>=2.15",
    "tomli>=1.1; python_version < '3.11'",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "tomli>=1.1",  # so ty can resolve the Python 3.10 fallback import
    "ruff>=0.12",
    "ty>=0.0.1a20",
]

[project.urls]
Homepage = "https://github.com/willwoodward/pi-cluster"
Source = "https://github.com/willwoodward/pi-cluster"
Issues = "https://github.com/willwoodward/pi-cluster/issues"
Changelog = "https://github.com/willwoodward/pi-cluster/blob/main/CHANGELOG.md"

[project.scripts]
cluster = "pi_cluster.cli:main"
pi-cluster = "pi_cluster.cli:main"

[tool.setuptools.packages.find]
include = ["pi_cluster", "pi_cluster.*"]

[tool.setuptools.package-data]
pi_cluster = ["data/**/*"]

[tool.setuptools.exclude-package-data]
pi_cluster = ["**/__pycache__/*", "**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["pi_cluster/data/lights/trinkey"]  # CircuitPython firmware

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ty.src]
exclude = ["pi_cluster/data"]  # runs on the Pis / in containers, not here
