apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: flask-demo
  template:
    metadata:
      labels:
        app: flask-demo
    spec:
      containers:
        - name: flask
          image: localhost:30007/demo-flask:latest
          imagePullPolicy: Always
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - containerPort: 3003
---
apiVersion: v1
kind: Service
metadata:
  name: flask-demo
spec:
  type: NodePort
  selector:
    app: flask-demo
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3003
      nodePort: 30005  # http://<any-node>:30005
